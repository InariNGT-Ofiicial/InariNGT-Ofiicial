<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="InariNGT — vibe coding for reproducible artifacts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="0.52" stop-color="#0c1118"/>
      <stop offset="1" stop-color="#151d27"/>
    </linearGradient>

    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0cf"/>
      <stop offset="0.42" stop-color="#ffc65c"/>
      <stop offset="0.78" stop-color="#ff9d1f"/>
      <stop offset="1" stop-color="#f0730f"/>
    </linearGradient>

    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.15"/>
      <stop offset="0.22" stop-color="#ffc65c" stop-opacity="0.95"/>
      <stop offset="0.78" stop-color="#ff9d1f" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f0730f" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.72" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff9d1f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff9d1f" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.038" stroke-width="1"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="300" fill="url(#glow)"/>
  <rect width="1280" height="300" fill="url(#scan)"/>

  <!-- frame corners -->
  <g stroke="#ffb020" stroke-opacity="0.42" stroke-width="1.2" fill="none">
    <path d="M26 44V26h18"/>
    <path d="M1236 26h18v18"/>
    <path d="M1254 256v18h-18"/>
    <path d="M44 274H26v-18"/>
  </g>

