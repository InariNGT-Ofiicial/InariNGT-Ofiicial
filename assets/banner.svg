  <text x="64" y="235" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8b949e" fill-opacity="0.78" letter-spacing="0.3">I vibe-code for speed — but the artifacts must reproduce.</text>

